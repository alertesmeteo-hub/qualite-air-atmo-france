name: Mise à jour qualité de l'air (Atmo France)

on:
  workflow_dispatch:
  schedule:
    # Les données Atmo France sont rafraîchies vers 12h00 Paris ; on vise un peu après,
    # à 11h30 UTC (13h30 Paris en été, 12h30 en hiver) pour laisser de la marge.
    # Second créneau 2 h plus tard : le déclenchement planifié GitHub dérive souvent
    # (constaté 15h-19h UTC au lieu de 11h30) ou saute un tick ; `concurrency` ci-dessous
    # évite tout chevauchement si les deux partent.
    - cron: "30 11 * * *"
    - cron: "30 13 * * *"

permissions:
  contents: write

concurrency:
  group: air-quality-production
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Récupérer les données Atmo France
        env:
          ATMO_USERNAME: ${{ secrets.ATMO_USERNAME }}
          ATMO_PASSWORD: ${{ secrets.ATMO_PASSWORD }}
        run: |
          # Coupures passagères de la source (connexion fermée, 429/5xx, délai dépassé) : jusqu'à 3 tentatives.
          set -o pipefail
          for attempt in 1 2 3; do
            if node scripts/fetch-atmo.mjs --output-dir data 2>&1 | tee "$RUNNER_TEMP/tentative.log"; then
              break
            fi
            if [ "$attempt" -eq 3 ] || ! grep -qiE 'RemoteDisconnected|Connection(Error|Reset|refused| aborted)|IncompleteRead|ReadTimeout|ConnectTimeout|ChunkedEncodingError|ProtocolError|Max retries exceeded|Temporary failure in name resolution|Name or service not known|SSLError|HTTP ?(Error)?:? ?(429|500|502|503|504)|(429|502|503|504) (Too Many|Bad Gateway|Service Unavailable|Gateway Time|Server)|Server is busy|ECONNRESET|ETIMEDOUT|EAI_AGAIN|fetch failed|socket hang up|timed out|Read timed' "$RUNNER_TEMP/tentative.log"; then
              echo "::error::Échec (tentative $attempt)"
              exit 1
            fi
            echo "Erreur réseau passagère (tentative $attempt), nouvelle tentative dans 90 s"
            sleep 90
          done

      - name: Vérifier la sortie
        run: |
          test -f data/departements.json
          test -f data/communes.json
          node -e "const d=require('./data/departements.json'); console.log(Object.keys(d.departements).length + ' departements')"
          node -e "const c=require('./data/communes.json'); console.log(Object.keys(c.communes).length + ' communes')"

      - name: Publier les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/departements.json data/communes.json
          git diff --staged --quiet && echo "Rien de nouveau." && exit 0
          git commit -m "chore: mise à jour qualité de l'air Atmo France"
          git push
